name: Backend CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
      MONGODB_URI: mongodb://127.0.0.1:27017/talkready_test
      NLP_SERVICE_URL: http://127.0.0.1:8000
      INTERNAL_KEY: test-internal-key-b9-ci
      JWT_ACCESS_SECRET: ci-access-secret-change-to-random-32-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-change-to-random-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage -- --runInBand
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage/

  nlp-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nlp-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest-cov ruff
      - run: ruff check app tests
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nlp-coverage
          path: nlp-service/coverage.xml

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend service images
        run: docker compose build
